name: Flutter Android Checks

on:
  push:
    branches: [android-flutter]
    paths:
      - "mobile/**"
      - ".github/workflows/flutter-android-check.yml"
  pull_request:
    branches: [android-flutter]
    paths:
      - "mobile/**"
      - ".github/workflows/flutter-android-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter version
        run: flutter --version
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Unit and widget tests
        run: flutter test
      - name: Build debug APK
        run: flutter build apk --debug
