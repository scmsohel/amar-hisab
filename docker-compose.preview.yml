services:
  amar-hisab-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: amar-hisab-web-preview
    restart: unless-stopped
    ports:
      - "${AMAR_HISAB_PORT:-8088}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
