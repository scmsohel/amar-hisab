name: Backend sync smoke test

on:
  push:
    branches: [backend-sync]
  pull_request:
    branches: [backend-sync]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-postgres-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: amarhisab_test
          POSTGRES_USER: amarhisab_test
          POSTGRES_PASSWORD: test-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U amarhisab_test -d amarhisab_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: api
    env:
      DATABASE_URL: postgres://amarhisab_test:test-only-password@localhost:5432/amarhisab_test
      SESSION_SECRET: test-only-session-secret-with-more-than-32-characters
      ADMIN_SETUP_KEY: test-only-setup-key
      ADMIN_EMAIL: admin@example.test
      ADMIN_PASSWORD: test-only-admin-password
      PORT: 3100
      TEST_SECOND_API_URL: http://127.0.0.1:3101
    steps:
      - name: Checkout backend-sync
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install API dependencies
        run: npm install --no-audit --no-fund
      - name: Check API syntax
        run: node --check server.mjs
      - name: Run sync API integration tests
        run: |
          node server.mjs > /tmp/amar-hisab-api-1.log 2>&1 &
          API_PID_1=$!
          PORT=3101 node server.mjs > /tmp/amar-hisab-api-2.log 2>&1 &
          API_PID_2=$!
          trap 'kill "$API_PID_1" "$API_PID_2" 2>/dev/null || true' EXIT
          for port in 3100 3101; do
            healthy=0
            for attempt in $(seq 1 30); do
              if curl --fail --silent "http://127.0.0.1:$port/health"; then
                echo
                healthy=1
                break
              fi
              sleep 2
            done
            if [ "$healthy" -ne 1 ]; then
              cat /tmp/amar-hisab-api-1.log /tmp/amar-hisab-api-2.log
              exit 1
            fi
          done
          node test-sync.mjs
